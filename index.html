    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .wrapper { max-width: 1300px; margin: 0 auto; }
    header {
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    h1 { font-size: 1.1rem; margin: 0; }
    .legend {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 12px;
    }
    @media (max-width: 860px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
    }

    #map {
      width: 100%;
      height: 580px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
    }

    #detailView {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }
    #detailView h2 { margin: 0 0 4px 0; font-size: 1.1rem; color: #38bdf8; }
    .stat-row { display: flex; justify-content: space-between; margin: 5px 0; font-size: 0.85rem; }
    .stat-val { font-weight: bold; }

    .controls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .search-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .sort-select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .list-box {
      max-height: 330px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .item-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .item-card:hover, .item-card.active {
      border-color: #38bdf8;
      background: #1e293b;
    }
    .item-header { display: flex; justify-content: space-between; font-weight: bold; }

    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 8px;
      border: 1px solid #475569;
    }
    .leaflet-popup-tip { background: #1e293b !important; }
  </style>
</head>

      { id:65, line:"山田線", sec:"上米内〜宮古", km:92.2, def:1749, coef:5120, rat:2.0, pass:71, diff:-90, lat:39.688, lng:141.588, coords:[[39.736,141.222],[39.640,141.954]] },
      { id:66, line:"米坂線", sec:"米沢〜今泉", km:23.0, def:539, coef:1941, rat:5.2, pass:539, diff:-73, lat:37.963, lng:140.075, coords:[[37.910,140.116],[38.016,140.033]] },
      { id:67, line:"米坂線", sec:"今泉〜小国", km:35.3, def:481, coef:4312, rat:2.3, pass:136, diff:-84, lat:38.041, lng:139.891, coords:[[38.016,140.033],[38.066,139.750]] },
      { id:68, line:"米坂線", sec:"小国〜坂町", km:32.4, def:340, coef:4524, rat:2.2, pass:86, diff:-90, lat:38.116, lng:139.591, coords:[[38.066,139.750],[38.166,139.433]] },
      { id:69, line:"陸羽西線", sec:"新庄〜余目", km:43.0, def:767, coef:3297, rat:3.0, pass:129, diff:-94, lat:38.805, lng:140.100, coords:[[38.761,140.301],[38.850,139.900]] },
      { id:70, line:"陸羽東線", sec:"古川〜鳴子温泉", km:35.5, def:1151, coef:1395, rat:7.2, pass:726, diff:-74, lat:38.657, lng:140.841, coords:[[38.571,140.966],[38.744,140.716]] },
      { id:71, line:"陸羽東線", sec:"鳴子温泉〜最上", km:20.7, def:439, coef:13465, rat:0.7, pass:51, diff:-89, lat:38.750, lng:140.616, coords:[[38.744,140.716],[38.755,140.516]] },
      { id:72, line:"陸羽東線", sec:"最上〜新庄", km:28.5, def:562, coef:3002, rat:3.3, pass:229, diff:-82, lat:38.758, lng:140.409, coords:[[38.755,140.516],[38.761,140.301]] }
    ];

    function getColor(pass) {
      if (pass < 500) return '#ef4444';
      if (pass < 1000) return '#f97316';
      return '#eab308';
    }

    const map = L.map('map').setView([38.2, 139.8], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markers = {};

    DATA72.forEach(item => {
      const color = getColor(item.pass);

      const poly = L.polyline(item.coords, {
        color: color,
        weight: 6,
        opacity: 0.85
      }).addTo(map);

      const marker = L.circleMarker([item.lat, item.lng], {
        radius: 7,
        fillColor: color,
        color: '#ffffff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map);

      const popupHtml = `
        <div style="font-size:0.95rem; font-weight:bold; margin-bottom:4px;">No.${item.id} ${item.line}</div>
        <div style="font-size:0.8rem; color:#cbd5e1; margin-bottom:6px;">${item.sec} (${item.km}km)</div>
        <div style="font-size:0.85rem; line-height:1.4;">
          <strong>営業係数:</strong> <span style="color:${color}; font-weight:bold;">${item.coef.toLocaleString()} 円</span><br>
          <strong>赤字額:</strong> ▲${item.def.toLocaleString()} 百万円<br>
          <strong>収支率:</strong> ${item.rat}%<br>
          <strong>輸送密度:</strong> ${item.pass} 人/日 (${item.diff}%)
        </div>
      `;
      marker.bindPopup(popupHtml);
      poly.bindPopup(popupHtml);

      const onSelect = () => {
        selectLine(item);
        marker.openPopup();
      };
      marker.on('click', onSelect);
      poly.on('click', onSelect);

      markers[item.id] = marker;
    });

    function selectLine(item) {
      const color = getColor(item.pass);
      document.getElementById('detailView').innerHTML = `
        <h2>${item.line} (No.${item.id})</h2>
        <div style="font-size:0.85rem; color:#cbd5e1; margin-bottom:6px;">${item.sec} (${item.km}km)</div>
        <div class="stat-row">
          <span>営業係数:</span>
          <span class="stat-val" style="color:${color}; font-size:1.15rem;">${item.coef.toLocaleString()} 円</span>
        </div>
        <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:6px;">（100円稼ぐのにかかった費用）</div>
        <div class="stat-row">
          <span>年間赤字額:</span>
          <span class="stat-val">▲${item.def.toLocaleString()} 百万円</span>
        </div>
        <div class="stat-row">
          <span>収支率:</span>
          <span class="stat-val">${item.rat}%</span>
        </div>
        <div class="stat-row">
          <span>2023年輸送密度:</span>
          <span class="stat-val">${item.pass.toLocaleString()} 人/日</span>
        </div>
        <div class="stat-row">
          <span>1987年比:</span>
          <span class="stat-val" style="color:#ef4444;">${item.diff}%</span>
        </div>
      `;

      document.querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('active');
        if (c.dataset.id == item.id) {
          c.classList.add('active');
          c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    function updateList() {
      const q = document.getElementById('searchBox').value.trim();
      const sort = document.getElementById('sortSelect').value;

      let list = [...DATA72];

      if (q) {
        list = list.filter(d => d.line.includes(q) || d.sec.includes(q));
      }

      if (sort === 'coef_desc') list.sort((a,b) => b.coef - a.coef);
      else if (sort === 'def_desc') list.sort((a,b) => b.def - a.def);
      else if (sort === 'pass_asc') list.sort((a,b) => a.pass - b.pass);
      else if (sort === 'id_asc') list.sort((a,b) => a.id - b.id);

      const box = document.getElementById('itemList');
      box.innerHTML = '';
      list.forEach(item => {
        const color = getColor(item.pass);
        const card = document.createElement('div');
        card.className = 'item-card';
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="item-header">
            <span>No.${item.id} ${item.line}</span>
            <span style="color:${color}; font-weight:bold;">${item.coef.toLocaleString()}円</span>
          </div>
          <div style="color:#94a3b8; font-size:0.75rem;">${item.sec} (赤字: ▲${item.def}百万円)</div>
        `;
        card.onclick = () => {
          selectLine(item);
          map.flyTo([item.lat, item.lng], 8);
          markers[item.id].openPopup();
        };
        box.appendChild(card);
      });
    }

    updateList();
    selectLine(DATA72[30]); // 初期選択：久留里線 (No.31)
  </script>
</body>
</html>
